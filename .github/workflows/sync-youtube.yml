name: Sync social dashboards

on:
  schedule:
    # 00:00 Asia/Seoul (UTC+9)
    - cron: "0 15 * * *"
    # GitHub 정각 혼잡으로 지연될 경우를 위한 당일 재시도
    - cron: "10 15 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 데이터를 다시 수집"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync-social-dashboards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public YouTube collector
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Fetch YouTube metrics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: node scripts/sync-youtube.mjs
      - name: Fetch Instagram metrics
        id: instagram
        continue-on-error: true
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'false' }}
        run: node scripts/sync-instagram.mjs
      - name: Save updated dashboard data
        run: |
          if git diff --quiet -- data/youtube.json data/instagram.json; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json data/instagram.json
          git commit -m "chore: sync social dashboard data"
          git push
      - name: Report incomplete integration
        if: steps.instagram.outcome == 'failure'
        run: |
          echo "::error title=Instagram sync incomplete::Repository secrets INSTAGRAM_ACCESS_TOKEN and INSTAGRAM_USER_ID are required."
          exit 1
