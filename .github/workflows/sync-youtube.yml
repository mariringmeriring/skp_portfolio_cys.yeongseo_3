name: Sync social dashboards

on:
  schedule:
    # 00:00 Asia/Seoul (UTC+9)
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-social-dashboards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch YouTube metrics
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/sync-youtube.mjs
      - name: Fetch Instagram metrics
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
        run: node scripts/sync-instagram.mjs
      - name: Save updated dashboard data
        run: |
          if git diff --quiet -- data/youtube.json data/instagram.json; then
            echo "No dashboard changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/youtube.json data/instagram.json
          git commit -m "chore: sync social dashboard data"
          git push
